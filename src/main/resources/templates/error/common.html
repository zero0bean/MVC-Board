<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${errorInfo.title}">Request Error</title>
        <link rel="stylesheet" th:href="@{/css/setup.css}">
    </head>
    <body>
        <main class="page-shell error-page">
            <p class="error-code" th:text="|Error ${errorInfo.status}">Error 500</p>
            <h1 th:text="${errorInfo.title}">Request Error</h1>
            <p th:text="${errorInfo.message}">The request could not be completed.</p>
            <p class="request-path" 
                th-if="${errorInfo.path}"
                th:text="|Request ${errorInfo.path}|">Request path</p>
            <a class="text-link" th:href="@{/setup/}">Back to Setup</a>
        </main>
    </body>
</html>
